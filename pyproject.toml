[project]
name = "episodic-memory-benchmark"
authors = [
    {name = "SaharaSurfer", email = "topbo3abp@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <3.14.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
main = []

dev = [
    "ruff (>=0.14.10,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "hypothesis (>=6.170.15,<7.0.0)",
    "mutmut (>=3.8.1,<4.0.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes
# I: isort
# B: flake8-bugbear
# UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["mbench", "tests"]
strict = true

[tool.pytest]
testpaths = ["tests"]
strict = true

[tool.mutmut]
source_paths = ["mbench/"]
only_mutate = [
    "mbench/core/legality/*",
    "mbench/core/folds/*",
]
pytest_add_cli_args = [
    "--hypothesis-profile=mutation",
    "--deselect=tests/core/test_accepted_commands.py::test_only_decide_makes_an_accepted_command",
]
use_git_change_detection = false
