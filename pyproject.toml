[project]
name = "episodic-memory-benchmark"
authors = [
    {name = "SaharaSurfer", email = "topbo3abp@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <3.14.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
main = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "networkx (>=3.6.1,<4.0.0)",
    "openai (>=3.14.0,<4.0.0)",
    "tiktoken (>=0.14.0,<0.15.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "json-repair (>=0.63.4,<0.64.0)",
    "faker (>=40.39.0,<41.0.0)"
]

dev = [
    "ruff (>=0.14.10,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes
# I: isort
# B: flake8-bugbear
# UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
